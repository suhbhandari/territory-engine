# Brief settings — home care, home health and hospice agencies. Read by src/brief.py.

model: claude-opus-5-5
effort: medium
# Used only to log cost per brief. Check current rates before quoting these.
price_per_mtok: {input: 4.00, output: 20.00}

# One brief per account group whose best account is in these tiers.
tiers: [A, B]

# Each source gives the label and link printed after a fact, and optionally date_column:
# the scored-list column holding the date that data was collected, printed as "checked <date>".
# discovered_at is filled by discover runs from 2026-10-12 on; it is blank for older data.
sources:
  registry:
    label: "NPPES NPI Registry record {entity_id}"
    url: "https://npiregistry.cms.hhs.gov/provider-view/{entity_id}"
    date_column: discovered_at
  careers:
    label: "Careers page"
    url: "{jobs_source_url}"
    date_column: signals_fetched_at
  website:
    label: "Company website"
    url: "{website}"
    date_column: signals_fetched_at
  listing:
    label: "Google Maps listing"
    url: "https://www.google.com/maps/place/?q=place_id:{entity_id}"
    date_column: discovered_at
  state_license:
    label: "NYS DOH Health Facility General Information"
    url: "https://health.data.ny.gov/d/vn5v-hh5r"
    date_column: signals_fetched_at
  # Derived by the engine from its own account list, so there is no outside page to link.
  territory_list:
    label: "This territory list, built from {source} records"
    url: ""
    date_column: discovered_at

# Capitalised words a brief or sequence may use without a fact containing them. The check
# flags any other capitalised word inside a sentence that its cited facts do not contain
# (a neighbourhood, an organisation, a job title). Street-type and compass words are here
# because the model writes "Street" for a fact's "St".
allowed_words: [Street, Avenue, Road, Boulevard, Parkway, Place, Lane, Highway, Turnpike, Drive, Court,
                Plaza, Terrace, East, West, North, South, URL]

# Each template becomes one numbered fact when its `when` holds (same condition
# syntax as rubric.yaml). The model may only use these facts.
facts:
  - text: "Registered in the national provider registry as \"{license_type}\", first enrolled in {npi_enrolled_year} ({npi_age_years} years ago)."
    when: {column: npi_enrolled_year, op: not_blank}
    source: registry
  - text: "Registered practice location: {address}, {city}, {state} {zip}. Phone {phone}."
    when: {column: npi_enrolled_year, op: not_blank}
    source: registry
  - text: "Listed on Google Maps at {address}, {city}, {state} {zip}. Phone {phone}."
    when: {column: npi_enrolled_year, op: blank}
    source: listing
  - text: "Holds a New York State licence of type {license_types} (LHCSA: licensed home care services agency; CHHA: certified home health agency; LTHHCP: long term home health care program; HSPC: hospice)."
    when: {column: license_status, op: eq, value: matched}
    source: state_license
  - text: "No matching record found in New York State's list of licensed home care and hospice providers, by name or phone. It may operate under a different name."
    when: {column: license_status, op: eq, value: not_found}
    source: state_license
  - text: "Has a company website: {website}"
    when: {column: website, op: not_blank}
    source: website
  - text: "{domain_account_count} accounts in this territory list share the website domain {website_domain}."
    when: {column: domain_account_count, op: gte, value: 2}
    source: territory_list
  - text: "Its job board ({jobs_ats}) lists {jobs_total} open roles located in {state}, out of {jobs_total_all_locations} across all locations."
    when:
      - {column: jobs_status, op: eq, value: counted}
      - {column: jobs_ats, op: not_blank}
    source: careers
  - text: "Its careers pages show at least {jobs_total} open role(s) in {state}; this is a partial count."
    when: {column: jobs_status, op: eq, value: listings_found}
    source: careers
  - text: "Of the open roles in {state}: {jobs_care_worker} are aide/caregiver roles, {jobs_scheduling_ops} are scheduling/coordination roles, {jobs_admin_compliance} are admin/compliance roles (by job-title keyword)."
    when: {column: jobs_total, op: gte, value: 1}
    source: careers
  - text: "Sample of open role titles: {jobs_titles_sample}"
    when: {column: jobs_titles_sample, op: not_blank}
    source: careers
  - text: "Runs hiring through the applicant-tracking system {jobs_ats}."
    when: {column: jobs_ats, op: not_blank}
    source: careers
  - text: "Its careers page sends applicants to an external job board."
    when: {column: jobs_status, op: eq, value: offsite_listings}
    source: careers
  - text: "Has a careers page on its website. We could not read any job listings from it, so whether it is hiring right now is unknown; listings may exist in a form we do not parse."
    when: {column: jobs_status, op: eq, value: careers_page_no_listings}
    source: careers
  - text: "Its website has no careers or jobs page that we could find."
    when: {column: jobs_status, op: eq, value: no_careers_page}
    source: website

# Written into the brief by code, not by the model.
unknowns:
  - text: "Number of open roles: the hiring system ({jobs_ats}) does not publish a feed we read."
    when: {column: jobs_status, op: eq, value: ats_unsupported}
  - text: "Number of open roles: listings are on an external job board we do not read."
    when: {column: jobs_status, op: eq, value: offsite_listings}
  - text: "Whether it is hiring right now: it has a careers page, but we could not read listings from it. Check the page before the call."
    when: {column: jobs_status, op: eq, value: careers_page_no_listings}
  - text: "Whether it is hiring right now: its website has no careers page we could find."
    when: {column: jobs_status, op: eq, value: no_careers_page}
  - text: "Number of open roles is a floor, not a full count."
    when: {column: jobs_status, op: eq, value: listings_found}
  - text: "Hiring activity: the website could not be read ({jobs_status})."
    when: {column: jobs_status, op: in, value: [site_unreachable, robots_disallowed, no_website]}
  - text: "Registry enrollment date: this account was found on Google Maps only and has no registry record matched."
    when: {column: npi_enrolled_year, op: blank}
  - text: "Headcount, client census, revenue and payer mix: no source for these is in the engine."
  - text: "Decision-maker names and titles: not collected."
  - text: "Software currently used for scheduling, compliance or onboarding: not collected."
