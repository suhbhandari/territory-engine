# Per-signal run settings read by the enrichment step:
#   mode: parallel | sequential (default sequential)
#   delay: seconds between calls, sequential only (default 1.2)
#   uses_website: true if the signal reads the account's website; it is re-run when the
#                 website on file changes
signals:
  careers_page:
    module: src.signals.careers_page
    uses_website: true
    description: Open job postings on the account's own careers page — proxy for active recruiting pain
    mode: parallel
    # Keywords used to classify job titles into role buckets.
    # Vertical-specific: what roles this buyer hires for.
    role_keywords:
      care_worker:
        - aide
        - caregiver
        - hha
        - cna
        - pca
        - personal care
        - home attendant
      scheduling_ops:
        - scheduler
        - coordinator
        - staffing
        - dispatch
      admin_compliance:
        - administrator
        - compliance
        - intake
        - billing
        - director
        - supervisor

  http_check:
    module: src.signals.http_check
    uses_website: true
    description: Website liveness and SSL as proxy for tech posture
    mode: parallel

  npi_age:
    module: src.signals.npi_age
    description: NPI enrollment date — newer agencies are in growth mode
    mode: sequential
    delay: 1.2

  state_license:
    module: src.signals.open_data_match
    description: Is the account in New York State's list of licensed home care and hospice providers
    mode: parallel
    prefix: license
    # NYS DOH Health Facility General Information. 1,427 records of these four types
    # statewide as of 2026-10-12: LHCSA (licensed home care services agency), CHHA
    # (certified home health agency), LTHHCP (long term home health care program), HSPC (hospice).
    url: https://health.data.ny.gov/resource/vn5v-hh5r.json
    query:
      $where: "fac_desc_short in('LHCSA','CHHA','LTHHCP','HSPC')"
      $limit: 50000
    name_fields: [operator_name, facility_name]
    zip_field: fac_zip
    phone_field: fac_phone
    type_field: fac_desc_short
