# Outreach sequence settings — home care, home health and hospice agencies.
# Read by src/sequence.py. Facts come from brief.yaml, so a sequence can only
# say what the brief can source.

model: claude-opus-5-5
effort: low
# Used only to log cost per sequence. Check current rates before quoting these.
price_per_mtok: {input: 4.00, output: 20.00}

tiers: [A, B]

subject_max_chars: 45
# The sending tool fills these. No contact names are collected by the engine.
merge_fields: ["{{first_name}}", "{{sender_first_name}}"]

touches:
  - id: email_1
    channel: email
    day: 1
    max_words: 90
    subject: true
    purpose: >
      First contact. Open with one specific, true observation about this agency, connect
      it to something this person cares about, and end with one easy question.
  - id: email_2
    channel: email
    day: 4
    max_words: 70
    # Sent as a reply in the first email's thread, so it has no subject of its own.
    subject: false
    purpose: >
      Follow-up in the same thread. Bring a different angle or fact from the first email;
      do not just ask whether they saw it. End with a low-effort question.
  - id: call_1
    channel: call
    day: 7
    max_words: 60
    purpose: >
      What the rep says in the first 20 seconds of a cold call: who they are, the one
      specific reason for calling this agency, and one question. Written to be spoken.
