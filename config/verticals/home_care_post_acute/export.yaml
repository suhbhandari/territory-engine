# Export targets — read by src/export.py.
#
# Headers are labels, not API names: Salesforce's Data Import Wizard and Outreach's
# bulk create both ask you to map each CSV column to a field at import time. The custom
# fields named here must be created in each tool first (see docs/stack-fit.md).
# Which tools the buyer's sales team actually runs is unconfirmed; this targets
# Salesforce and Outreach because they are the most common pairing.
#
# A column `value` is a template over the scored account's fields. Group rows can also
# use <touch>_subject, <touch>_body, <touch>_core (greeting and sign-off removed),
# <touch>_script (merge fields as bracketed words), persona and brief_file.

# Our drafts use neutral merge fields; these are swapped for the sending tool's own.
# Confirm the exact variable names in Outreach's variable picker before relying on them.
merge_field_map:
  "{{sender_first_name}}": "{{sender.first_name}}"

# For text a rep reads aloud (call openers), merge fields become plain bracketed words.
script_placeholders:
  "{{first_name}}": "[their first name]"
  "{{sender_first_name}}": "[your first name]"

targets:

  # One row per account in tiers A-C. Tier D is left out: almost all of it is accounts
  # with no web presence that could not be assessed, and loading 1,000 of those into a
  # CRM is clutter, not pipeline.
  salesforce_accounts:
    file: salesforce_accounts.csv
    rows: accounts
    tiers: [A, B, C]
    unique_key: Territory Engine ID
    required: [Account Name, Territory Engine ID]
    columns:
      - {header: Account Name, value: "{name}"}
      - {header: Phone, value: "{phone}"}
      - {header: Website, value: "{website}"}
      - {header: Billing Street, value: "{address}"}
      - {header: Billing City, value: "{city}"}
      - {header: Billing State/Province, value: "{state}"}
      - {header: Billing Zip/Postal Code, value: "{zip}"}
      - {header: Description, value: "{score_reasons}"}
      # Custom fields. Territory Engine ID should be created as an External ID so
      # re-imports update accounts instead of duplicating them.
      - {header: Territory Engine ID, value: "{entity_id}"}
      - {header: Territory Tier, value: "{tier}"}
      - {header: Territory Score, value: "{score}"}
      - {header: Territory Data Coverage, value: "{data_coverage}"}
      - {header: Territory Group, value: "{account_group}"}
      - {header: Territory Group Rank, value: "{group_rank}"}
      - {header: Locations In Group, value: "{group_size}"}
      - {header: Open Roles In Area, value: "{jobs_total}"}
      - {header: Hiring System, value: "{jobs_ats}"}
      - {header: Hiring Check Status, value: "{jobs_status}"}
      - {header: Careers Page, value: "{jobs_source_url}"}
      - {header: Agency Type, value: "{license_type}"}
      - {header: State License, value: "{license_types}"}
      - {header: Years Registered, value: "{npi_age_years}"}
      - {header: Found Via, value: "{source}"}
      - {header: Signals Checked On, value: "{signals_fetched_at:.10}"}

  # One row per account group in tiers A-B that has a sequence which passed its checks.
  # The personalised copy rides on account custom fields; an Outreach sequence then
  # needs only three generic steps whose templates pull those fields in.
  outreach_accounts:
    file: outreach_accounts.csv
    rows: groups
    tiers: [A, B]
    require: email_1_core
    unique_key: Territory Engine ID
    required: [Account Name, Email 1 Subject, Email 1 Body, Email 2 Body, Call Opener]
    no_merge_fields: true
    columns:
      - {header: Account Name, value: "{name}"}
      - {header: Domain, value: "{website_domain}"}
      - {header: Website, value: "{website}"}
      - {header: Phone, value: "{phone}"}
      - {header: Territory Engine ID, value: "{entity_id}"}
      - {header: Territory Tier, value: "{tier}"}
      - {header: Territory Group Rank, value: "{group_rank}"}
      - {header: Write To Role, value: "{persona}"}
      - {header: Email 1 Subject, value: "{email_1_subject}"}
      - {header: Email 1 Body, value: "{email_1_core}"}
      - {header: Email 2 Body, value: "{email_2_core}"}
      - {header: Call Opener, value: "{call_1_script}"}
      - {header: Why This Account, value: "{score_reasons}"}
      - {header: Brief File, value: "{brief_file}"}

# HubSpot companies, written through the API by src/push_hubspot.py (not a CSV).
# `make hubspot-setup` creates the group and every property not marked standard;
# `make push-hubspot` upserts one company per account in `tiers`, keyed on id_property.
#
# A property's `value` has one template per source: `public` is the anonymized build
# (outputs/public/accounts_public.csv, safe to show on screen), `raw` the private scored
# file. A source with no template leaves that property alone. The two sources use
# different IDs, so they make separate companies; push one or the other to an account.
# `type` and `field_type` are HubSpot's own: string/text, number/number,
# enumeration/select (needs options), bool/booleancheckbox.
hubspot:
  object: companies
  id_property: territory_engine_id
  tiers: [A, B, C]
  group: {name: territory_engine, label: Territory Engine}
  properties:
    # HubSpot's own company properties: filled, never created.
    - {name: name, standard: true, value: {public: "{id}", raw: "{name}"}}
    - {name: phone, standard: true, value: {raw: "{phone}"}}
    - {name: website, standard: true, value: {raw: "{website}"}}
    - {name: domain, standard: true, value: {raw: "{website_domain}"}}
    - {name: address, standard: true, value: {raw: "{address}"}}
    - {name: city, standard: true, value: {public: "{city}", raw: "{city}"}}
    - {name: state, standard: true, value: {raw: "{state}"}}
    - {name: zip, standard: true, value: {raw: "{zip}"}}
    - {name: description, standard: true, value: {raw: "{score_reasons}"}}
    # Custom properties, created in the Territory Engine group.
    - name: territory_engine_id
      label: Territory Engine ID
      type: string
      field_type: text
      unique: true
      value: {public: "{id}", raw: "{entity_id}"}
    - name: territory_tier
      label: Territory Tier
      type: enumeration
      field_type: select
      options: [A, B, C, D]
      value: {public: "{tier}", raw: "{tier}"}
    - {name: territory_score, label: Territory Score, type: number, field_type: number,
       value: {public: "{score}", raw: "{score}"}}
    - {name: territory_rank, label: Territory Group Rank, type: number, field_type: number,
       value: {public: "{rank}", raw: "{group_rank}"}}
    - {name: territory_data_coverage, label: Territory Data Coverage, type: number, field_type: number,
       value: {public: "{data_coverage}", raw: "{data_coverage}"}}
    - {name: territory_locations, label: Locations In Group, type: number, field_type: number,
       value: {public: "{locations}", raw: "{group_size}"}}
    - {name: territory_agency_type, label: Agency Type, type: string, field_type: text,
       value: {public: "{type}", raw: "{license_type}"}}
    - {name: territory_years_registered, label: Years Registered, type: number, field_type: number,
       value: {public: "{years_registered}", raw: "{npi_age_years}"}}
    - {name: territory_hiring_status, label: Hiring Check Status, type: string, field_type: text,
       value: {public: "{hiring_status}", raw: "{jobs_status}"}}
    - {name: territory_open_roles, label: Open Roles In Area, type: string, field_type: text,
       value: {public: "{open_roles}", raw: "{jobs_total}"}}
    - {name: territory_write_to, label: Write To Role, type: string, field_type: text,
       value: {public: "{persona}"}}
    - {name: territory_found_via, label: Found Via, type: string, field_type: text,
       value: {raw: "{source}"}}
    - {name: territory_signals_checked, label: Signals Checked On, type: string, field_type: text,
       value: {raw: "{signals_fetched_at:.10}"}}
